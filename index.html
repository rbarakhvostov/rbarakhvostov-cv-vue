<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="cv.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roman Barakhvostov</title>
    <!--
      Тема и язык до первой отрисовки: main.ts — deferred-модуль, без этого
      светлая/русская версия мигнула бы тёмной английской.
      Правила разрешения должны совпадать с useResumeTheme / useResumeLocale.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        var lang = null;

        try {
          theme = localStorage.getItem('rb-resume-theme');
          lang = localStorage.getItem('rb-resume-lang');
        } catch (error) {
          // private mode / blocked storage
        }

        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }

        if (lang !== 'en' && lang !== 'ru') {
          var tags = navigator.languages || [navigator.language];
          lang = 'en';

          for (var i = 0; i < tags.length; i += 1) {
            var language = String(tags[i] || '')
              .split('-')[0]
              .toLowerCase();

            if (language === 'en' || language === 'ru') {
              lang = language;
              break;
            }
          }
        }

        root.dataset.theme = theme;
        root.lang = lang;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script
      data-goatcounter="https://rbarakhvostov.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.v5.js"
      integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
