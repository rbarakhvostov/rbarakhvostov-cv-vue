<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/cv.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Roman Barakhvostov</title>
    <!--app-head-->
    <!--
      Выполняется до первой отрисовки, потому что main.ts — отложенный модуль.
      Правила темы обязаны совпадать с useResumeTheme, правила языка — с
      localeFromPath. Решения покрыты inlineBootstrap.spec.ts: меняя скрипт,
      правьте и тест.
    -->
    <script>
      (function () {
        var LANG_KEY = 'rb-resume-lang';
        var THEME_KEY = 'rb-resume-theme';

        var read = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        };

        var prefersRussian = function () {
          var tags = navigator.languages || [navigator.language];

          for (var i = 0; i < tags.length; i += 1) {
            var language = String(tags[i] || '')
              .split('-')[0]
              .toLowerCase();

            if (language === 'en' || language === 'ru') {
              return language === 'ru';
            }
          }

          return false;
        };

        var storedLang = read(LANG_KEY);

        if (storedLang !== 'en' && storedLang !== 'ru') {
          storedLang = null;
        }

        // Два инварианта: уводим только с корня (/ru/ — явно запрошенный
        // адрес) и к navigator обращаемся только при отсутствии сохранённого
        // выбора — иначе русский браузер не смог бы уйти на английскую версию.
        var wantsRussian =
          storedLang === 'ru' || (storedLang === null && prefersRussian());

        if (wantsRussian && location.pathname === '/') {
          location.replace('/ru/' + location.search + location.hash);

          return;
        }

        var theme = read(THEME_KEY);

        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }

        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
    <script
      data-goatcounter="https://rbarakhvostov.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.v5.js"
      integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
