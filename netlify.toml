# Настройки сборки держим в репозитории, а не в UI Netlify: иначе версия Node
# и команда сборки молча разъезжаются с package.json.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Слэш в конце `/ru/` добавляет встроенная функция Pretty URLs (включена по
# умолчанию). Правилом редиректа это делать НЕЛЬЗЯ: CDN нормализует путь до
# сопоставления, поэтому `from = "/ru"` совпало бы и с `/ru/` — получился бы
# бесконечный редирект и русская версия легла бы целиком.
# https://docs.netlify.com/manage/routing/redirects/redirect-options/

# `/en` никуда не ведёт — английская версия живёт в корне. Но раз рядом есть
# `/ru/`, этот адрес легко угадать руками, поэтому отправляем на корень, а не
# в 404. Петли нет: цель — другой путь.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301

# PDF — та же информация, что и на странице. В выдаче они конкурируют с ней за
# те же запросы и уводят посетителя в файл вместо интерактивного резюме.
# Убрать блок, если захочется, чтобы PDF тоже индексировались.
[[headers]]
  for = "/uploads/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
